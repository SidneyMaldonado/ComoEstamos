<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">

  <!-- === NOTA ENTRANDO (esquerda) === -->
  <g transform="translate(30, 158)">
    <rect x="0" y="10" width="100" height="64" rx="7" ry="7"
          fill="none" stroke="#FFD700" stroke-width="7"/>
    <circle cx="50" cy="42" r="14" fill="none" stroke="#FFD700" stroke-width="5"/>
    <line x1="50" y1="34" x2="50" y2="50" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
    <line x1="43" y1="36" x2="57" y2="36" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <line x1="43" y1="48" x2="57" y2="48" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <!-- seta entrada -->
    <line x1="106" y1="42" x2="128" y2="42" stroke="#7CFC00" stroke-width="6" stroke-linecap="round"/>
    <polygon points="124,34 140,42 124,50" fill="#7CFC00"/>
  </g>

  <!-- === CARTEIRA CENTRAL === -->
  <g transform="translate(158, 148)">
    <!-- corpo -->
    <rect x="0" y="0" width="140" height="96" rx="12" ry="12"
          fill="#0F1E50" stroke="#FFD700" stroke-width="7"/>
    <!-- aba topo -->
    <rect x="0" y="0" width="140" height="30" rx="12" ry="12"
          fill="#162660" stroke="#FFD700" stroke-width="5"/>
    <!-- compartimento moeda -->
    <circle cx="108" cy="62" r="22" fill="#0F1E50" stroke="#FFD700" stroke-width="5"/>
    <line x1="108" y1="52" x2="108" y2="72" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
    <line x1="99"  y1="55" x2="117" y2="55" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <line x1="99"  y1="69" x2="117" y2="69" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <!-- linhas internas -->
    <rect x="14" y="42" width="62" height="10" rx="4"
          fill="none" stroke="#FFD700" stroke-width="3"/>
    <line x1="14" y1="66" x2="62" y2="66" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="80" x2="50" y2="80" stroke="#FFD700" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4"/>
  </g>

  <!-- === MOEDAS ACIMA === -->
  <circle cx="228" cy="96"  r="26" fill="none" stroke="#FFD700" stroke-width="6"/>
  <line x1="228" y1="82"  x2="228" y2="110" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>
  <line x1="217" y1="86"  x2="239" y2="86"  stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <line x1="217" y1="106" x2="239" y2="106" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <!-- seta descendo -->
  <line x1="228" y1="124" x2="228" y2="146" stroke="#FFD700" stroke-width="5" stroke-linecap="round" stroke-dasharray="6,4"/>
  <polygon points="218,142 228,158 238,142" fill="#FFD700"/>

  <!-- === NOTA SAINDO (direita) === -->
  <g transform="translate(286, 268)">
    <!-- seta saída -->
    <line x1="0" y1="32" x2="22" y2="32" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round"/>
    <polygon points="18,24 34,32 18,40" fill="#FF6B6B"/>
    <!-- nota -->
    <rect x="34" y="0" width="100" height="64" rx="7" ry="7"
          fill="none" stroke="#FF6B6B" stroke-width="7"/>
    <circle cx="84" cy="32" r="14" fill="none" stroke="#FF6B6B" stroke-width="5"/>
    <line x1="84" y1="24" x2="84" y2="40" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
    <line x1="77" y1="27" x2="91" y2="27" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>
    <line x1="77" y1="37" x2="91" y2="37" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- === LINHA BASE === -->
  <line x1="80" y1="370" x2="376" y2="370"
        stroke="#FFD700" stroke-width="5" stroke-linecap="round" stroke-dasharray="10,6"/>
  <polygon points="228,370 214,392 242,392" fill="#FFD700"/>

</svg>

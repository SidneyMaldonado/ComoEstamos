<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">

  <!-- Fundo azul -->
  <rect width="456" height="456" fill="#1A2E6E"/>

  <!-- === NOTA ENTRANDO (vindo da esquerda) === -->
  <g transform="translate(52, 168)">
    <!-- Corpo da nota -->
    <rect x="0" y="20" width="130" height="80" rx="8" ry="8"
          fill="none" stroke="#FFD700" stroke-width="4"/>
    <!-- Linhas internas da nota -->
    <line x1="20" y1="50" x2="110" y2="50" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="65" x2="90" y2="65" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,4"/>
    <!-- Símbolo $ no centro -->
    <circle cx="65" cy="60" r="16" fill="none" stroke="#FFD700" stroke-width="2.5"/>
    <text x="65" y="66" text-anchor="middle" fill="#FFD700"
          font-family="serif" font-size="18" font-weight="bold">$</text>
    <!-- Seta de entrada (apontando para direita, entrando) -->
    <line x1="140" y1="60" x2="168" y2="60" stroke="#7CFC00" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="168,53 182,60 168,67" fill="#7CFC00"/>
  </g>

  <!-- === MOEDAS CAINDO (centro-topo) === -->
  <g transform="translate(186, 90)">
    <!-- Moeda 1 (maior, centro) -->
    <circle cx="42" cy="28" r="22" fill="none" stroke="#FFD700" stroke-width="4"/>
    <circle cx="42" cy="28" r="14" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="42" y="35" text-anchor="middle" fill="#FFD700"
          font-family="serif" font-size="18" font-weight="bold">$</text>
    <!-- Moeda 2 (direita, menor) -->
    <circle cx="88" cy="45" r="15" fill="none" stroke="#FFD700" stroke-width="3"/>
    <text x="88" y="51" text-anchor="middle" fill="#FFD700"
          font-family="serif" font-size="13" font-weight="bold">$</text>
    <!-- Moeda 3 (esquerda, menor) -->
    <circle cx="0" cy="50" r="12" fill="none" stroke="#FFD700" stroke-width="3"/>
    <text x="0" y="55" text-anchor="middle" fill="#FFD700"
          font-family="serif" font-size="11" font-weight="bold">$</text>
    <!-- Setas de queda (para baixo) -->
    <line x1="42" y1="52" x2="42" y2="78" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5,3"/>
    <polygon points="36,76 42,90 48,76" fill="#FFD700"/>
    <line x1="88" y1="62" x2="88" y2="82" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,3"/>
    <polygon points="83,80 88,92 93,80" fill="#FFD700"/>
  </g>

  <!-- === CARTEIRA / COFRE (centro da imagem) === -->
  <g transform="translate(168, 196)">
    <!-- Corpo da carteira -->
    <rect x="0" y="10" width="120" height="80" rx="10" ry="10"
          fill="#0F1E50" stroke="#FFD700" stroke-width="3.5"/>
    <!-- Aba da carteira -->
    <rect x="0" y="10" width="120" height="28" rx="10" ry="10"
          fill="#1A2E6E" stroke="#FFD700" stroke-width="2.5"/>
    <!-- Compartimento de moeda -->
    <circle cx="90" cy="56" r="18" fill="#0F1E50" stroke="#FFD700" stroke-width="2.5"/>
    <text x="90" y="62" text-anchor="middle" fill="#FFD700"
          font-family="serif" font-size="16" font-weight="bold">$</text>
    <!-- Linhas de cartão dentro -->
    <rect x="12" y="44" width="54" height="10" rx="3"
          fill="none" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="14" y1="62" x2="52" y2="62" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="72" x2="44" y2="72" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,4"/>
  </g>

  <!-- === NOTA SAINDO (indo para a direita) === -->
  <g transform="translate(274, 288)">
    <!-- Seta de saída (apontando para direita) -->
    <line x1="0" y1="40" x2="28" y2="40" stroke="#FF6B6B" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="24,33 38,40 24,47" fill="#FF6B6B"/>
    <!-- Corpo da nota -->
    <rect x="38" y="0" width="130" height="80" rx="8" ry="8"
          fill="none" stroke="#FF6B6B" stroke-width="4"/>
    <!-- Linhas internas -->
    <line x1="58" y1="30" x2="148" y2="30" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="58" y1="45" x2="128" y2="45" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,4"/>
    <!-- Símbolo $ -->
    <circle cx="103" cy="40" r="16" fill="none" stroke="#FF6B6B" stroke-width="2.5"/>
    <text x="103" y="46" text-anchor="middle" fill="#FF6B6B"
          font-family="serif" font-size="18" font-weight="bold">$</text>
  </g>

  <!-- === LINHA DE BASE / BALANÇA === -->
  <line x1="80" y1="392" x2="376" y2="392" stroke="#FFD700" stroke-width="3" stroke-linecap="round" stroke-dasharray="8,5"/>
  <!-- Triângulo balança -->
  <polygon points="228,392 214,416 242,416" fill="#FFD700"/>

</svg>
